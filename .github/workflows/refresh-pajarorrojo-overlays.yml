name: Refresh Pi-Station-X overlay art

on:
  push:
    branches:
      - sync/pajarorrojo-overlay-refresh
    paths:
      - scripts/sync-pajarorrojo-overlays.py
      - .github/workflows/refresh-pajarorrojo-overlays.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-overlays:
    if: github.repository == 'Renetrox/Pi-Station-X'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image optimizer
        run: python -m pip install 'Pillow>=11,<13'
      - name: Import missing assets from pinned upstream revision
        run: python scripts/sync-pajarorrojo-overlays.py
      - name: Commit new optimized PNGs to this branch
        run: |
          git add _inc/collection-overlays/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Import and optimize new Pajarorrojo overlay PNGs'
            git push origin HEAD
          fi
